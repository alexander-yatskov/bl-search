name: Release browser extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(jq -r '.version' extension/manifest.json)"
          if [ "v${manifest_version}" != "${RELEASE_TAG}" ]; then
            echo "Tag ${RELEASE_TAG} does not match manifest v${manifest_version}"
            exit 1
          fi

      - name: Package extension-only archive
        run: |
          archive="$(./scripts/package-extension.sh)"
          sha256sum "$archive" > "${archive}.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="dist/bl-search-extension-${RELEASE_TAG}-store.zip"
          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          if [ -f "${notes_file}" ]; then
            gh release create "${RELEASE_TAG}" \
              "${archive}" \
              "${archive}.sha256" \
              --title "BL Search ${RELEASE_TAG}" \
              --notes-file "${notes_file}"
          else
            gh release create "${RELEASE_TAG}" \
              "${archive}" \
              "${archive}.sha256" \
              --title "BL Search ${RELEASE_TAG}" \
              --generate-notes
          fi
